<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Wat moet ik aan? - Admin Portal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }
        .header h1 { font-size: 32px; margin-bottom: 10px; }
        .header p { opacity: 0.9; }
        .content {
            padding: 40px;
        }
        .section {
            margin-bottom: 40px;
            padding-bottom: 40px;
            border-bottom: 1px solid #eee;
        }
        .section:last-child { border-bottom: none; }
        .section h2 {
            font-size: 20px;
            color: #333;
            margin-bottom: 20px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
            font-size: 14px;
        }
        input, select {
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }
        .slider-group {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .slider-value {
            min-width: 50px;
            font-weight: 600;
            color: #667eea;
        }
        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }
        button {
            padding: 14px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-save {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            flex: 1;
        }
        .btn-save:hover {
            opacity: 0.9;
        }
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            display: none;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
            display: block;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌡️ Wat moet ik aan? Admin Portal</h1>
            <p>Pas alle parameters aan en sla op naar GitHub</p>
        </div>
        
        <div class="content">
            <form id="parametersForm">
                <!-- SEIZOENEN -->
                <div class="section">
                    <h2>📅 Seizoen Bepaling</h2>
                    <div id="seasonsContainer"></div>
                </div>

                <!-- DREMPELS -->
                <div class="section">
                    <h2>🌡️ Temperatuur Drempels</h2>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="twee_stage_drempel">Twee-stage drempel (°C)</label>
                            <div class="slider-group">
                                <input type="range" id="twee_stage_drempel" min="1" max="15" value="8">
                                <span class="slider-value" id="twee_stage_drempel_value">8°</span>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="muts_drempel">Muts drempel (°C)</label>
                            <input type="number" id="muts_drempel" value="5" step="0.5">
                        </div>
                        <div class="form-group">
                            <label for="wanten_drempel">Wanten drempel (°C)</label>
                            <input type="number" id="wanten_drempel" value="0" step="0.5">
                        </div>
                        <div class="form-group">
                            <label for="sjaal_drempel">Sjaal drempel (°C)</label>
                            <input type="number" id="sjaal_drempel" value="5" step="0.5">
                        </div>
                    </div>
                </div>

                <!-- JAS LOGICA -->
                <div class="section">
                    <h2>🧥 Jas Logica</h2>
                    <div id="jasContainer"></div>
                </div>

                <!-- SCHOENEN LOGICA -->
                <div class="section">
                    <h2>👟 Schoenen Logica</h2>
                    <div id="schoenenContainer"></div>
                </div>

                <!-- BUTTONS -->
                <div class="action-buttons">
                    <button type="submit" class="btn-save">💾 Opslaan naar GitHub</button>
                </div>
                
                <div id="status" class="status"></div>
            </form>
        </div>
    </div>

    <script>
        const GITHUB_TOKEN = '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';
        const GITHUB_REPO = 'loukanton/WatmoetikaanDash';
        const FILE_PATH = 'parameters.json';

        let parametersData = null;

        // Proper UTF-8 to Base64 conversion
        function stringToBase64(str) {
            try {
                return btoa(unescape(encodeURIComponent(str)));
            } catch(e) {
                console.error('Encoding error:', e);
                // Fallback: use TextEncoder
                const encoder = new TextEncoder();
                const data = encoder.encode(str);
                let binary = '';
                for (let i = 0; i < data.length; i++) {
                    binary += String.fromCharCode(data[i]);
                }
                return btoa(binary);
            }
        }

        // Load parameters
        async function loadParameters() {
            try {
                const response = await fetch(`https://raw.githubusercontent.com/${GITHUB_REPO}/main/${FILE_PATH}`);
                if (response.ok) {
                    parametersData = await response.json();
                    renderForm();
                }
            } catch (error) {
                showStatus('Kon parameters niet laden', 'error');
            }
        }

        function renderForm() {
            if (!parametersData) return;

            // Seizoenen
            const seasonsHTML = Object.entries(parametersData.seizoenen).map(([key, season]) => `
                <div style="background: #f9f9f9; padding: 15px; border-radius: 8px; margin-bottom: 15px;">
                    <h3>${key}</h3>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Start datum</label>
                            <input type="date" class="season-field" data-season="${key}" data-field="start_date" value="${season.start_date}">
                        </div>
                        <div class="form-group">
                            <label>End datum</label>
                            <input type="date" class="season-field" data-season="${key}" data-field="end_date" value="${season.end_date}">
                        </div>
                        <div class="form-group">
                            <label>Korte broek drempel boy</label>
                            <input type="number" class="season-field" data-season="${key}" data-field="korte_broek_drempel_boy" value="${season.korte_broek_drempel_boy}" step="0.5">
                        </div>
                        <div class="form-group">
                            <label>Korte broek drempel girl</label>
                            <input type="number" class="season-field" data-season="${key}" data-field="korte_broek_drempel_girl" value="${season.korte_broek_drempel_girl}" step="0.5">
                        </div>
                    </div>
                </div>
            `).join('');
            document.getElementById('seasonsContainer').innerHTML = seasonsHTML;

            // Jas
            const jasHTML = Object.entries(parametersData.jas_logica).map(([key, jas]) => `
                <div style="background: #f9f9f9; padding: 15px; border-radius: 8px; margin-bottom: 15px;">
                    <h3>${key}</h3>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Emoji</label>
                            <input type="text" class="jas-field" data-jas="${key}" data-field="emoji" value="${jas.emoji}">
                        </div>
                        <div class="form-group">
                            <label>Label</label>
                            <input type="text" class="jas-field" data-jas="${key}" data-field="label" value="${jas.label}">
                        </div>
                        ${jas.temp_min !== undefined ? `<div class="form-group"><label>Min temp</label><input type="number" class="jas-field" data-jas="${key}" data-field="temp_min" value="${jas.temp_min}" step="0.5"></div>` : ''}
                        ${jas.temp_max !== undefined ? `<div class="form-group"><label>Max temp</label><input type="number" class="jas-field" data-jas="${key}" data-field="temp_max" value="${jas.temp_max}" step="0.5"></div>` : ''}
                    </div>
                </div>
            `).join('');
            document.getElementById('jasContainer').innerHTML = jasHTML;

            // Schoenen
            const schoenenHTML = Object.entries(parametersData.schoenen_logica).map(([key, schoen]) => `
                <div style="background: #f9f9f9; padding: 15px; border-radius: 8px; margin-bottom: 15px;">
                    <h3>${key}</h3>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Emoji</label>
                            <input type="text" class="schoen-field" data-schoen="${key}" data-field="emoji" value="${schoen.emoji}">
                        </div>
                        <div class="form-group">
                            <label>Label</label>
                            <input type="text" class="schoen-field" data-schoen="${key}" data-field="label" value="${schoen.label}">
                        </div>
                        ${schoen.temp_min !== undefined ? `<div class="form-group"><label>Min temp</label><input type="number" class="schoen-field" data-schoen="${key}" data-field="temp_min" value="${schoen.temp_min}" step="0.5"></div>` : ''}
                    </div>
                </div>
            `).join('');
            document.getElementById('schoenenContainer').innerHTML = schoenenHTML;
        }

        // Slider
        document.addEventListener('change', function(e) {
            if (e.target.type === 'range') {
                const valueElement = document.getElementById(e.target.id + '_value');
                if (valueElement) {
                    valueElement.textContent = e.target.value + '°';
                }
            }
        });

        // Submit
        document.getElementById('parametersForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            document.querySelectorAll('.season-field').forEach(field => {
                const season = field.dataset.season;
                const fieldName = field.dataset.field;
                const value = isNaN(field.value) ? field.value : parseFloat(field.value);
                parametersData.seizoenen[season][fieldName] = value;
            });

            document.querySelectorAll('.jas-field').forEach(field => {
                const jas = field.dataset.jas;
                const fieldName = field.dataset.field;
                parametersData.jas_logica[jas][fieldName] = field.value;
            });

            document.querySelectorAll('.schoen-field').forEach(field => {
                const schoen = field.dataset.schoen;
                const fieldName = field.dataset.field;
                parametersData.schoenen_logica[schoen][fieldName] = field.value;
            });

            parametersData.drempels.twee_stage_drempel = parseInt(document.getElementById('twee_stage_drempel').value);
            parametersData.drempels.muts_drempel = parseFloat(document.getElementById('muts_drempel').value);
            parametersData.drempels.wanten_drempel = parseFloat(document.getElementById('wanten_drempel').value);
            parametersData.drempels.sjaal_drempel = parseFloat(document.getElementById('sjaal_drempel').value);

            await pushToGitHub(parametersData);
        });

        async function pushToGitHub(data) {
            try {
                const sha = await getFileSHA();
                const jsonString = JSON.stringify(data, null, 2);
                const content = stringToBase64(jsonString);
                
                const response = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/${FILE_PATH}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${GITHUB_TOKEN}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: 'Update parameters via Admin Portal',
                        content: content,
                        sha: sha
                    })
                });

                if (response.ok) {
                    showStatus('✅ Opgeslagen naar GitHub!', 'success');
                } else {
                    const error = await response.json();
                    showStatus('❌ Error: ' + (error.message || 'Unknown error'), 'error');
                }
            } catch (error) {
                showStatus(`❌ Error: ${error.message}`, 'error');
            }
        }

        async function getFileSHA() {
            const response = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/${FILE_PATH}`, {
                headers: { 'Authorization': `token ${GITHUB_TOKEN}` }
            });
            const data = await response.json();
            return data.sha;
        }

        function showStatus(message, type) {
            const statusEl = document.getElementById('status');
            statusEl.textContent = message;
            statusEl.className = `status ${type}`;
            setTimeout(() => { statusEl.className = 'status'; }, 5000);
        }

        loadParameters();
    </script>
</body>
</html>
